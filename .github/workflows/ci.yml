on:
  push:
jobs:
  Build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: temurin
          cache: 'gradle'
          cache-dependency-path:
            'build.gradle.kts'
      - name: Build
        run: ./gradlew build